<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none">
  <style>
    .kbach { stroke: #d97706; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .kbach-fill { fill: #fef3c7; fill-opacity: 0.15; stroke: #ca8a04; stroke-width: 1.2; }
    .kbach-thin { stroke: #eab308; stroke-width: 0.8; stroke-dasharray: 2 2; }
  </style>

  <g opacity="0.18">
    <!-- Center Flower Motif at (60,60) -->
    <g transform="translate(60,60)">
      <!-- Outer Petals (4 cardinal directions) -->
      <!-- Top Petal -->
      <path class="kbach-fill" d="M 0,-34 C -12,-20 -14,-10 0,-4 C 14,-10 12,-20 0,-34 Z" />
      <path class="kbach" d="M 0,-38 C -4,-30 0,-24 0,-38 C 4,-30 0,-24 0,-38 C -16,-20 -14,-8 0,0 C 14,-8 16,-20 0,-38 Z" />

      <!-- Bottom Petal -->
      <path class="kbach-fill" d="M 0,34 C -12,20 -14,10 0,4 C 14,10 12,20 0,34 Z" />
      <path class="kbach" d="M 0,38 C -4,30 0,24 0,38 C 4,30 0,24 0,38 C -16,20 -14,8 0,0 C 14,8 16,20 0,38 Z" />

      <!-- Left Petal -->
      <path class="kbach-fill" d="M -34,0 C -20,-12 -10,-14 -4,0 C -10,14 -20,12 -34,0 Z" />
      <path class="kbach" d="M -38,0 C -30,-4 -24,0 -38,0 C -30,4 -24,0 -38,0 C -20,-16 -8,-14 0,0 C -8,14 -20,16 -38,0 Z" />

      <!-- Right Petal -->
      <path class="kbach-fill" d="M 34,0 C 20,-12 10,-14 4,0 C 10,14 20,12 34,0 Z" />
      <path class="kbach" d="M 38,0 C 30,-4 24,0 38,0 C 30,4 24,0 38,0 C 20,-16 8,-14 0,0 C 8,14 20,16 38,0 Z" />

      <!-- Diagonal Accent Petals -->
      <g transform="rotate(45)">
        <path class="kbach-fill" d="M 0,-26 C -8,-16 -10,-8 0,-3 C 10,-8 8,-16 0,-26 Z" />
        <path class="kbach" d="M 0,-28 C -10,-14 -8,-6 0,0 C 8,-6 10,-14 0,-28 Z" />
      </g>
      <g transform="rotate(135)">
        <path class="kbach-fill" d="M 0,-26 C -8,-16 -10,-8 0,-3 C 10,-8 8,-16 0,-26 Z" />
        <path class="kbach" d="M 0,-28 C -10,-14 -8,-6 0,0 C 8,-6 10,-14 0,-28 Z" />
      </g>
      <g transform="rotate(225)">
        <path class="kbach-fill" d="M 0,-26 C -8,-16 -10,-8 0,-3 C 10,-8 8,-16 0,-26 Z" />
        <path class="kbach" d="M 0,-28 C -10,-14 -8,-6 0,0 C 8,-6 10,-14 0,-28 Z" />
      </g>
      <g transform="rotate(315)">
        <path class="kbach-fill" d="M 0,-26 C -8,-16 -10,-8 0,-3 C 10,-8 8,-16 0,-26 Z" />
        <path class="kbach" d="M 0,-28 C -10,-14 -8,-6 0,0 C 8,-6 10,-14 0,-28 Z" />
      </g>

      <!-- Central Rings -->
      <circle cx="0" cy="0" r="10" class="kbach-fill" />
      <circle cx="0" cy="0" r="6" class="kbach" />
      <circle cx="0" cy="0" r="3" fill="#ca8a04" />
    </g>

    <!-- Corner Motifs (for seamless 120x120 tiling) -->
    <!-- Top-Left (0,0) -->
    <g transform="translate(0,0)">
      <circle cx="0" cy="0" r="8" class="kbach-fill" />
      <circle cx="0" cy="0" r="4" class="kbach" />
      <path class="kbach" d="M 0,0 L 14,14 M 0,0 L -14,-14 M 0,0 L -14,14 M 0,0 L 14,-14" />
    </g>
    <!-- Top-Right (120,0) -->
    <g transform="translate(120,0)">
      <circle cx="0" cy="0" r="8" class="kbach-fill" />
      <circle cx="0" cy="0" r="4" class="kbach" />
      <path class="kbach" d="M 0,0 L 14,14 M 0,0 L -14,-14 M 0,0 L -14,14 M 0,0 L 14,-14" />
    </g>
    <!-- Bottom-Left (0,120) -->
    <g transform="translate(0,120)">
      <circle cx="0" cy="0" r="8" class="kbach-fill" />
      <circle cx="0" cy="0" r="4" class="kbach" />
      <path class="kbach" d="M 0,0 L 14,14 M 0,0 L -14,-14 M 0,0 L 14,-14" />
    </g>
    <!-- Bottom-Right (120,120) -->
    <g transform="translate(120,120)">
      <circle cx="0" cy="0" r="8" class="kbach-fill" />
      <circle cx="0" cy="0" r="4" class="kbach" />
      <path class="kbach" d="M 0,0 L 14,14 M 0,0 L -14,-14 M 0,0 L -14,14 M 0,0 L 14,-14" />
    </g>
  </g>
</svg>
